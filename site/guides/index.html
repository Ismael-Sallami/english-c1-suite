<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guías y Banco C1 · English C1 Suite</title>
  <meta name="description" content="Guía táctica de Aptis ESOL General C1, banco de preguntas reales y guion de Topic Task para Trinity C1.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
  <script>
    // Sincroniza el tema claro/oscuro antes del primer pintado para evitar parpadeos.
    (function () {
      try {
        var saved = localStorage.getItem("course-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch (e) {}
    })();
  </script>
  <style>
    :root, [data-theme="light"] {
      --bg: #eef2ef;
      --bg-grid: rgba(13, 15, 18, 0.05);
      --surface: #ffffff;
      --surface-2: #f4f7f5;
      --ink: #0d0f12;
      --muted: #5a635f;
      --accent: #0f9e86;
      --accent-2: #4fb31f;
      --accent-ink: #ffffff;
      --shadow-col: #0d0f12;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0d0f12;
      --bg-grid: rgba(244, 247, 245, 0.035);
      --surface: #16181c;
      --surface-2: #1b1e23;
      --ink: #f4f7f5;
      --muted: #939b97;
      --accent: #2ee6c5;
      --accent-2: #b8ff3c;
      --accent-ink: #07120f;
      --shadow-col: #b8ff3c;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Manrope", system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px clamp(16px, 4vw, 40px);
      background: var(--surface);
      border-bottom: 2px solid var(--ink);
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--shadow-col);
    }
    .btn-accent {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 32px) 64px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 84px;
      background: var(--surface);
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--shadow-col);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.45rem;
      line-height: 1.05;
    }
    .sidebar p {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .doc-btn {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border: 2px solid var(--ink);
      background: var(--surface-2);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .doc-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 3px 3px 0 var(--shadow-col);
    }
    .doc-btn[aria-current="true"] {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .doc-btn strong { font-size: 0.94rem; }
    .doc-btn span { font-size: 0.78rem; opacity: 0.85; }
    .toc {
      border-top: 2px solid var(--ink);
      padding-top: 12px;
      max-height: 40vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toc-title {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .toc a {
      font-size: 0.82rem;
      text-decoration: none;
      color: var(--muted);
      line-height: 1.3;
    }
    .toc a:hover { color: var(--ink); text-decoration: underline; }
    .toc a.lvl3 { padding-left: 12px; font-size: 0.78rem; }
    .article {
      background: var(--surface);
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--shadow-col);
      padding: clamp(20px, 4vw, 40px);
      min-width: 0;
    }
    .article-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 16px;
      margin-bottom: 22px;
      border-bottom: 2px solid var(--ink);
    }
    .search-box {
      padding: 8px 12px;
      border: 2px solid var(--ink);
      background: var(--surface-2);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      min-width: 240px;
      flex: 1;
      max-width: 380px;
    }
    .md h1, .md h2, .md h3, .md h4 {
      font-family: "Bricolage Grotesque", sans-serif;
      line-height: 1.15;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    .md h1 { font-size: clamp(1.7rem, 3vw, 2.2rem); margin-top: 0; }
    .md h2 { font-size: 1.38rem; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
    .md h3 { font-size: 1.12rem; color: var(--accent); }
    .md p { margin: 0.75em 0; }
    .md ul, .md ol { margin: 0.75em 0; padding-left: 1.5em; }
    .md li { margin: 0.35em 0; }
    .md blockquote {
      margin: 1em 0;
      padding: 10px 14px;
      border-left: 4px solid var(--accent);
      background: var(--surface-2);
    }
    .md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
      padding: 2px 5px;
      background: var(--surface-2);
      border: 1px solid var(--ink);
    }
    .md pre {
      margin: 1em 0;
      padding: 14px;
      overflow: auto;
      background: var(--surface-2);
      border: 2px solid var(--ink);
    }
    .md pre code { border: 0; padding: 0; background: transparent; }
    .md table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.9rem;
    }
    .md th, .md td {
      border: 1.5px solid var(--ink);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .md th { background: var(--surface-2); font-weight: 700; }
    .md mark {
      background: var(--accent-2);
      color: #0d0f12;
      padding: 0 3px;
    }
    .status { color: var(--muted); font-size: 0.95rem; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="btn" href="../">← Suite C1</a>
      <a class="btn" href="../aptis/">Simulador Aptis</a>
      <a class="btn" href="../writing-library/">Biblioteca Writings</a>
      <a class="btn" href="../writing-cheatsheet/">Chuleta C1</a>
    </div>
    <div class="topbar-right">
      <button class="btn" type="button" id="themeBtn">Cambiar tema</button>
    </div>
  </header>

  <main class="shell">
    <aside class="sidebar">
      <div>
        <h1>Guías y Banco C1</h1>
        <p>Apuntes operativos para preparar Aptis ESOL General (banda C) y la prueba oral de Trinity.</p>
      </div>
      <div id="docList" style="display:flex;flex-direction:column;gap:8px;"></div>
      <div class="toc" id="tocBox" hidden>
        <span class="toc-title">Índice del documento</span>
        <div id="tocLinks" style="display:flex;flex-direction:column;gap:5px;"></div>
      </div>
    </aside>

    <article class="article">
      <div class="article-tools">
        <input class="search-box" id="filterInput" type="search" placeholder="Filtrar o resaltar término en el texto...">
        <a class="btn btn-accent" id="rawLink" href="./data/estructura-aptis-c1.md" download>Descargar .md</a>
      </div>
      <div class="md" id="content">
        <p class="status">Cargando documento...</p>
      </div>
    </article>
  </main>

  <script>
    (() => {
      "use strict";

      // Catálogo de guías disponibles en ./data/.
      const DOCS = [
        {
          id: "estructura",
          title: "Estructura y Guía Táctica Aptis C1",
          meta: "Tiempos, calibrador Core y rúbricas",
          file: "./data/estructura-aptis-c1.md",
        },
        {
          id: "banco",
          title: "Banco de Preguntas Reales Aptis C1",
          meta: "Speaking, Writing, Core y modelos",
          file: "./data/banco-preguntas-aptis.md",
        },
        {
          id: "topic",
          title: "Topic C1 Trinity: AI Catalyst or Threat",
          meta: "Guion oral editable (~480 palabras)",
          file: "./data/topic-ai-trinity.md",
        },
      ];

      const cache = new Map();
      let currentDoc = DOCS[0];
      let currentRaw = "";

      const escapeHtml = (str) =>
        str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      // Convierte sintaxis inline básica de Markdown sobre texto ya escapado.
      function renderInline(raw) {
        let out = escapeHtml(raw);
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        out = out.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener">$1</a>'
        );
        return out;
      }

      // Parser Markdown ligero por bloques para evitar dependencias externas.
      function renderMarkdown(md) {
        const lines = md.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        const toc = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];

          if (/^```/.test(line)) {
            const buf = [];
            i += 1;
            while (i < lines.length && !/^```/.test(lines[i])) {
              buf.push(escapeHtml(lines[i]));
              i += 1;
            }
            html.push(`<pre><code>${buf.join("\n")}</code></pre>`);
            i += 1;
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            const text = heading[2].trim();
            const slug = "h-" + toc.length + "-" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 32);
            if (level === 2 || level === 3) {
              toc.push({ level, text, slug });
            }
            html.push(`<h${level} id="${slug}">${renderInline(text)}</h${level}>`);
            i += 1;
            continue;
          }

          if (/^>\s?/.test(line)) {
            const quoteLines = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              quoteLines.push(renderInline(lines[i].replace(/^>\s?/, "")));
              i += 1;
            }
            html.push(`<blockquote>${quoteLines.join("<br>")}</blockquote>`);
            continue;
          }

          // Tabla GFM básica: fila de cabecera + fila separadora |---|---|
          if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) {
            const parseRow = (row) =>
              row
                .trim()
                .replace(/^\|/, "")
                .replace(/\|$/, "")
                .split("|")
                .map((cell) => cell.trim());
            const headers = parseRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
              rows.push(parseRow(lines[i]));
              i += 1;
            }
            html.push(
              `<table><thead><tr>${headers.map((h) => `<th>${renderInline(h)}</th>`).join("")}</tr></thead>` +
                `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
            );
            continue;
          }

          if (/^\s*[-*]\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
              items.push(`<li>${renderInline(lines[i].replace(/^\s*[-*]\s+/, ""))}</li>`);
              i += 1;
            }
            html.push(`<ul>${items.join("")}</ul>`);
            continue;
          }

          if (/^\s*\d+\.\s+/.test(line)) {
            const items = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
              items.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
              i += 1;
            }
            html.push(`<ol>${items.join("")}</ol>`);
            continue;
          }

          if (line.trim() === "" || /^---+$/.test(line.trim())) {
            i += 1;
            continue;
          }

          const para = [];
          while (
            i < lines.length &&
            lines[i].trim() !== "" &&
            !/^(#{1,4}\s|>\s?|```|\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i])
          ) {
            para.push(renderInline(lines[i]));
            i += 1;
          }
          html.push(`<p>${para.join(" ")}</p>`);
        }

        return { html: html.join("\n"), toc };
      }

      function highlightTerm(container, query) {
        if (!query) return;
        const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp(safe, "gi");
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.parentElement && ["CODE", "PRE", "SCRIPT", "STYLE"].includes(node.parentElement.tagName)) {
            continue;
          }
          if (re.test(node.nodeValue)) nodes.push(node);
          re.lastIndex = 0;
        }
        for (const textNode of nodes) {
          const frag = document.createDocumentFragment();
          let last = 0;
          textNode.nodeValue.replace(re, (match, offset) => {
            if (offset > last) frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, offset)));
            const mark = document.createElement("mark");
            mark.textContent = match;
            frag.appendChild(mark);
            last = offset + match.length;
          });
          if (last < textNode.nodeValue.length) {
            frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
          }
          textNode.parentNode.replaceChild(frag, textNode);
        }
      }

      function renderCurrent() {
        const contentEl = document.getElementById("content");
        const tocBox = document.getElementById("tocBox");
        const tocLinks = document.getElementById("tocLinks");
        const { html, toc } = renderMarkdown(currentRaw);

        contentEl.innerHTML = html;
        const q = document.getElementById("filterInput").value.trim();
        if (q.length >= 2) highlightTerm(contentEl, q);

        if (toc.length > 0) {
          tocBox.hidden = false;
          tocLinks.innerHTML = toc
            .map((item) => `<a class="${item.level === 3 ? "lvl3" : ""}" href="#${item.slug}">${escapeHtml(item.text)}</a>`)
            .join("");
        } else {
          tocBox.hidden = true;
          tocLinks.innerHTML = "";
        }
      }

      function renderSidebar() {
        const list = document.getElementById("docList");
        list.innerHTML = DOCS.map(
          (doc) =>
            `<button type="button" class="doc-btn" data-doc="${doc.id}" aria-current="${doc.id === currentDoc.id}">` +
            `<strong>${escapeHtml(doc.title)}</strong>` +
            `<span>${escapeHtml(doc.meta)}</span>` +
            `</button>`
        ).join("");
      }

      async function loadDoc(id) {
        const found = DOCS.find((d) => d.id === id) || DOCS[0];
        currentDoc = found;
        renderSidebar();
        const rawLink = document.getElementById("rawLink");
        rawLink.href = found.file;
        rawLink.setAttribute("download", found.file.split("/").pop());
        window.location.hash = found.id;

        const contentEl = document.getElementById("content");
        if (!cache.has(found.id)) {
          contentEl.innerHTML = '<p class="status">Cargando documento...</p>';
          try {
            const res = await fetch(found.file);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            cache.set(found.id, await res.text());
          } catch (err) {
            contentEl.innerHTML = `<p class="status">No se pudo cargar ${escapeHtml(found.file)} (${escapeHtml(String(err))}).</p>`;
            return;
          }
        }
        currentRaw = cache.get(found.id);
        renderCurrent();
      }

      document.getElementById("docList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-doc]");
        if (btn) loadDoc(btn.dataset.doc);
      });

      document.getElementById("filterInput").addEventListener("input", () => {
        if (currentRaw) renderCurrent();
      });

      document.getElementById("themeBtn").addEventListener("click", () => {
        const root = document.documentElement;
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("course-theme", next); } catch (e) {}
      });

      const initialHash = window.location.hash.replace("#", "");
      loadDoc(initialHash || DOCS[0].id);
    })();
  </script>
</body>
</html>
